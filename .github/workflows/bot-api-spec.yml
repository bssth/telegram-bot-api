name: Bot API spec

# Compares the library with the latest published Telegram Bot API
# specification, so that new Bot API releases are noticed quickly.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  specdiff:
    name: Compare with the Bot API specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Report missing types, fields, methods and parameters
        run: go run ./internal/cmd/specdiff -strict
