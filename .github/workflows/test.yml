name: Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', 'stable']
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Never on pull requests (fork PRs get no secrets, and the tests talk to a
    # real bot); on push only for master.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'master') }}
    timeout-minutes: 15
    concurrency:
      group: telegram-integration
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
      TELEGRAM_TEST_CHANNEL: ${{ secrets.TELEGRAM_TEST_CHANNEL }}
      TELEGRAM_TEST_SUPERGROUP_ID: ${{ secrets.TELEGRAM_TEST_SUPERGROUP_ID }}
    steps:
      - name: Skip notice
        if: env.TELEGRAM_BOT_TOKEN == ''
        run: |
          echo "::notice title=Integration tests skipped::skipping: secrets not configured (TELEGRAM_BOT_TOKEN is empty)"

      - name: Check out code
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Go
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run integration tests
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: go test -v -race -count=1 ./...
